<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project — Katrina Khoury</title>
  <meta name="description" content="Case study — Katrina Khoury, Graphic Designer & Illustrator">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;0,9..144,900;1,9..144,300;1,9..144,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=DM+Mono&display=swap" rel="stylesheet">

  <style>
    /* ── Tokens ─────────────────────────────────────────── */
    :root {
      --canvas:      #F5F5F2;
      --ink:         #111111;
      --dust:        #6E6E6A;
      --wire:        #D5D5D1;
      --signal:      #3A2FD9;

      --margin:      80px;
      --section-gap: 96px;

      --f-display:   'Fraunces', serif;
      --f-body:      'DM Sans', sans-serif;
      --f-mono:      'DM Mono', monospace;
    }

    /* ── Reset ───────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--canvas);
      color: var(--ink);
      font-family: var(--f-body);
      font-size: 17px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }

    a:focus-visible {
      outline: 2px solid var(--signal);
      outline-offset: 4px;
      border-radius: 2px;
    }

    img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ── Nav ─────────────────────────────────────────────── */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px var(--margin);
      background: var(--canvas);
      border-bottom: 1px solid var(--wire);
    }

    .nav__name {
      font-family: var(--f-display);
      font-style: italic;
      font-weight: 300;
      font-size: 14px;
      font-variation-settings: 'opsz' 9;
      letter-spacing: 0.01em;
      transition: color 0.2s ease;
    }

    .nav__name:hover { color: var(--signal); }

    .nav__back {
      font-family: var(--f-mono);
      font-size: 10px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--dust);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: color 0.2s ease;
    }

    .nav__back:hover { color: var(--signal); }

    .nav__back-arrow {
      display: inline-block;
      transition: transform 0.2s ease;
    }

    .nav__back:hover .nav__back-arrow {
      transform: translateX(-3px);
    }

    /* ── Hero ─────────────────────────────────────────────── */
    .project-hero {
      margin-top: 65px; /* nav height */
      width: 100%;
      height: 72vh;
      min-height: 480px;
      overflow: hidden;
      background: #1a1a1a;
    }

    .project-hero__img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ── Project header ──────────────────────────────────── */
    .project-header {
      padding: 56px var(--margin) 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
      align-items: start;
    }

    .project-header__left {}

    .project-meta {
      font-family: var(--f-mono);
      font-size: 10px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--dust);
      margin-bottom: 20px;
    }

    .project-title {
      font-family: var(--f-display);
      font-weight: 900;
      font-variation-settings: 'opsz' 144;
      font-size: clamp(40px, 4.5vw, 68px);
      line-height: 0.95;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    .project-header__right {
      padding-top: 36px; /* align with first line of title */
    }

    .project-description {
      font-family: var(--f-body);
      font-size: 17px;
      line-height: 1.72;
      color: var(--dust);
      max-width: 480px;
    }

    /* ── Divider ─────────────────────────────────────────── */
    .divider {
      margin: 56px var(--margin) 0;
      border: none;
      border-top: 1px solid var(--wire);
    }

    /* ── Gallery ─────────────────────────────────────────── */
    .gallery {
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .gallery-row {
      display: flex;
      gap: 4px;
    }

    /* Full-width image */
    .gallery-img--full {
      width: 100%;
      overflow: hidden;
    }

    .gallery-img--full img {
      width: 100%;
      height: 60vh;
      min-height: 360px;
      object-fit: cover;
      display: block;
    }

    /* Half-width (for pairs) */
    .gallery-img--half {
      flex: 1;
      overflow: hidden;
    }

    .gallery-img--half img {
      width: 100%;
      height: 56vh;
      min-height: 320px;
      object-fit: cover;
      display: block;
    }

    /* Tall portrait variant */
    .gallery-img--portrait img {
      height: 80vh;
      min-height: 520px;
    }

    /* Padded images (shown with canvas bg, not edge-to-edge) */
    .gallery-img--padded {
      padding: 48px var(--margin);
    }

    /* explicit override — higher specificity beats full/half fixed heights */
    .gallery-img--full.gallery-img--padded img,
    .gallery-img--half.gallery-img--padded img,
    .gallery-img--padded img {
      height: auto;
      min-height: 0;
      object-fit: contain;
    }

    /* ── Project nav (next/prev) ─────────────────────────── */
    .project-nav {
      margin-top: var(--section-gap);
      border-top: 1px solid var(--wire);
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .project-nav__item {
      padding: 40px var(--margin);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: background 0.2s ease;
      text-decoration: none;
      color: var(--ink);
    }

    .project-nav__item:hover {
      background: rgba(58, 47, 217, 0.04);
    }

    .project-nav__item--next {
      text-align: right;
      border-left: 1px solid var(--wire);
    }

    .project-nav__label {
      font-family: var(--f-mono);
      font-size: 10px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--dust);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .project-nav__item--next .project-nav__label {
      justify-content: flex-end;
    }

    .project-nav__arrow {
      display: inline-block;
      transition: transform 0.2s ease;
    }

    .project-nav__item:hover .project-nav__arrow--prev {
      transform: translateX(-3px);
    }

    .project-nav__item:hover .project-nav__arrow--next {
      transform: translateX(3px);
    }

    .project-nav__title {
      font-family: var(--f-display);
      font-weight: 700;
      font-variation-settings: 'opsz' 40;
      font-size: clamp(20px, 2.2vw, 32px);
      line-height: 1.1;
      color: var(--ink);
    }

    .project-nav__item--next .project-nav__title {
      text-align: right;
    }

    /* ── Footer ──────────────────────────────────────────── */
    .footer {
      padding: 22px var(--margin);
      border-top: 1px solid var(--wire);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer__copy {
      font-family: var(--f-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--dust);
    }

    .footer__status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--f-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--dust);
    }

    .footer__dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--signal);
      flex-shrink: 0;
    }

    /* ── 404 / loading ───────────────────────────────────── */
    .not-found {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 var(--margin);
    }

    .not-found__label {
      font-family: var(--f-mono);
      font-size: 10px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--dust);
      margin-bottom: 20px;
    }

    .not-found__heading {
      font-family: var(--f-display);
      font-weight: 900;
      font-variation-settings: 'opsz' 144;
      font-size: clamp(48px, 6vw, 88px);
      line-height: 0.95;
      letter-spacing: -0.02em;
      color: var(--ink);
      margin-bottom: 40px;
    }

    .not-found__link {
      font-family: var(--f-mono);
      font-size: 11px;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      color: var(--signal);
      border-bottom: 1px solid var(--signal);
      padding-bottom: 2px;
      width: fit-content;
    }

    /* ── Responsive ──────────────────────────────────────── */
    @media (max-width: 768px) {
      :root {
        --margin: 24px;
        --section-gap: 72px;
      }

      .nav { padding: 18px var(--margin); }

      .project-hero { height: 55vw; min-height: 260px; margin-top: 57px; }

      .project-header {
        grid-template-columns: 1fr;
        gap: 28px;
        padding-top: 40px;
      }

      .project-header__right { padding-top: 0; }

      .project-description { max-width: 100%; }

      .gallery-row { flex-direction: column; }

      .gallery-img--half img,
      .gallery-img--full img {
        height: 65vw;
        min-height: 220px;
      }

      .gallery-img--portrait img {
        height: 90vw;
        min-height: 320px;
      }

      .gallery-img--padded { padding: 0 var(--margin); }

      .project-nav {
        grid-template-columns: 1fr;
      }

      .project-nav__item--next {
        border-left: none;
        border-top: 1px solid var(--wire);
        text-align: left;
      }

      .project-nav__item--next .project-nav__label { justify-content: flex-start; }
      .project-nav__item--next .project-nav__title { text-align: left; }

      .footer { flex-direction: column; gap: 12px; text-align: center; }
    }

    /* ── Reduced motion ──────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .nav__back-arrow,
      .project-nav__arrow { transition: none; }
    }
  </style>
  <script defer src="/_vercel/insights/script.js"></script>
</head>

<body>

  <!-- ── Nav ── -->
  <nav class="nav" aria-label="Main navigation">
    <a href="index.html" class="nav__name">Katrina Khoury</a>
    <a href="index.html#work" class="nav__back">
      <span class="nav__back-arrow" aria-hidden="true">←</span>
      All work
    </a>
  </nav>


  <!-- ── Page content (populated by JS) ── -->
  <main id="main-content">
    <!-- injected below -->
  </main>


  <!-- ── Footer ── -->
  <footer class="footer">
    <span class="footer__copy">© 2026 Katrina Khoury</span>
    <span class="footer__status">
      <span class="footer__dot" aria-hidden="true"></span>
      Open to work
    </span>
  </footer>


  <script>
    /* ── Project data ─────────────────────────────────────── */
    const PROJECTS = [
      {
        id: 'sands',
        title: 'Sands Coffee Brandmark',
        category: 'Brand Identity',
        year: '2026',
        description: 'Logo design, typography, and brand application for a California-based coffee brand. The identity was built to feel warm and character-driven, then tested across apparel and environmental signage.',
        hero: 'content/ARTWORK/Sands%20Coffee%20Brandmark/SANDStshirt.jpg',
        heroAlt: 'Sands Coffee brandmark applied to a t-shirt, worn in the café',
        gallery: [
          { type: 'full', src: 'content/ARTWORK/Sands%20Coffee%20Brandmark/SANDS%20coffee%20Logo%20Progression.jpg', alt: 'Sands Coffee logo progression — sketches to final mark' },
          { type: 'pair', images: [
            { src: 'content/ARTWORK/Sands%20Coffee%20Brandmark/SANDS-5.png', alt: 'Sands Coffee final brandmark on white', padded: true },
            { src: 'content/ARTWORK/Sands%20Coffee%20Brandmark/SANDSmockup.png', alt: 'Sands Coffee brand applied in-environment' },
          ]},
        ]
      },
      {
        id: 'babas',
        title: 'Baba\'s Coffee Corner',
        category: 'Brand Identity',
        year: '2026',
        description: 'Complete brand identity for a new California-based coffee shop — logo, typography, color system, and menu design. Built to feel neighborhood-rooted and welcoming without losing visual sharpness.',
        hero: 'content/ARTWORK/BABAS/IMG_5549.jpg',
        heroAlt: 'Baba\'s Coffee Corner brand collateral in context',
        gallery: [
          { type: 'pair', images: [
            { src: 'content/ARTWORK/BABAS/IMG_8343.jpg', alt: 'Baba\'s Coffee Corner brand assets on display' },
            { src: 'content/ARTWORK/BABAS/IMG_8344.jpg', alt: 'Baba\'s Coffee Corner signage detail' },
          ]},
          { type: 'pair', images: [
            { src: 'content/ARTWORK/BABAS/Baba%E2%80%99s%20Coffee%20Corner%20Logo%20Development/1.png', alt: 'Logo development — early explorations', padded: true },
            { src: 'content/ARTWORK/BABAS/Baba%E2%80%99s%20Coffee%20Corner%20Logo%20Development/2.png', alt: 'Logo development — refined direction', padded: true },
          ]},
        ]
      },
      {
        id: 'lace-leaf',
        title: 'Lace Leaf',
        category: 'Poster Design',
        year: '2026',
        description: 'Editorial poster exploring botanical illustration and typographic hierarchy. The lace leaf\'s intricate vein structure informed both the compositional logic and the weight relationships between type and image.',
        hero: 'content/ARTWORK/Lace%20Leaf%20Poster/LaceleafPosterMockup.JPG',
        heroAlt: 'Lace Leaf poster mounted and photographed in-situ',
        gallery: [
          { type: 'full', padded: true, src: 'content/ARTWORK/Lace%20Leaf%20Poster/LaceleafPoster2026%202.JPG', alt: 'Lace Leaf — final poster design' },
        ]
      },
      {
        id: 'crystal',
        title: 'Crystal',
        category: 'Print Design',
        year: '2026',
        description: 'Business card system for a crystal and wellness brand — flat layout, print production, and styled photography of the finished pieces. Each card design references a specific stone\'s color and character.',
        hero: 'content/ARTWORK/CRYSTAL/FullSizeRender_VSCO%203.JPG',
        heroAlt: 'Crystal business cards — styled photograph of the printed set',
        gallery: [
          { type: 'full', src: 'content/ARTWORK/CRYSTAL/mycards-01.PNG', alt: 'Crystal card designs — full set flat lay' },
          { type: 'pair', images: [
            { src: 'content/ARTWORK/CRYSTAL/mycards-02.PNG', alt: 'Crystal card designs — detail view' },
            { src: 'content/ARTWORK/CRYSTAL/mycards-03.PNG', alt: 'Crystal card designs — reverse side' },
          ]},
          { type: 'pair', images: [
            { src: 'content/ARTWORK/CRYSTAL/cardprintlayout%202.JPG', alt: 'Print layout sheet', padded: true },
            { src: 'content/ARTWORK/CRYSTAL/FullSizeRender_VSCO%204.JPG', alt: 'Styled photograph — printed cards in hand' },
          ]},
        ]
      },
      {
        id: 'food-deserts',
        title: 'Food Deserts',
        category: 'Poster · Lettering',
        year: '2022',
        description: 'Poster campaign addressing food access inequality in underserved communities. Custom hand lettering anchors the composition, with typography and color chosen to carry urgency without sacrificing clarity.',
        hero: 'content/ARTWORK/Food%20Deserts%20Poster/fooddesertsmockup.jpg',
        heroAlt: 'Food Deserts poster mounted in a gallery context',
        gallery: [
          { type: 'full', padded: true, src: 'content/ARTWORK/Food%20Deserts%20Poster/letteringproject.jpg', alt: 'Food Deserts — hand lettering detail' },
        ]
      },
      {
        id: 'visual-storytelling',
        title: 'Visual Storytelling',
        category: 'Illustration',
        year: '2025',
        description: 'Editorial illustration and accordion-format book exploring the relationship between sound, space, and visual perception. Developed as a SJSU senior studio project.',
        hero: 'content/ARTWORK/Visual%20Storytelling/Khoury_KatrinaP1Mockup.png',
        heroAlt: 'Visual Storytelling — accordion book mockup showing two-panel spread',
        gallery: []
      },
    ];


    /* ── Routing ──────────────────────────────────────────── */
    function getProjectId() {
      const params = new URLSearchParams(window.location.search);
      return params.get('id');
    }

    function getProject(id) {
      return PROJECTS.find(p => p.id === id) || null;
    }

    function getAdjacentProjects(id) {
      const idx = PROJECTS.findIndex(p => p.id === id);
      if (idx === -1) return { prev: null, next: null };
      const prev = PROJECTS[(idx - 1 + PROJECTS.length) % PROJECTS.length];
      const next = PROJECTS[(idx + 1) % PROJECTS.length];
      return { prev, next };
    }


    /* ── HTML builders ───────────────────────────────────── */
    function buildGalleryItem(item) {
      if (item.type === 'full') {
        return `
          <div class="gallery-img--full${item.portrait ? ' gallery-img--portrait' : ''}${item.padded ? ' gallery-img--padded' : ''}">
            <img src="${item.src}" alt="${item.alt}" loading="lazy">
          </div>`;
      }
      if (item.type === 'pair') {
        const imgs = item.images.map(img => `
          <div class="gallery-img--half${img.padded ? ' gallery-img--padded' : ''}">
            <img src="${img.src}" alt="${img.alt}" loading="lazy">
          </div>`).join('');
        return `<div class="gallery-row">${imgs}</div>`;
      }
      return '';
    }

    function buildPage(project, prev, next) {
      const galleryHTML = project.gallery.length
        ? `<section class="gallery" aria-label="Project images">
            ${project.gallery.map(buildGalleryItem).join('')}
           </section>`
        : '';

      const prevHTML = prev
        ? `<a href="project.html?id=${prev.id}" class="project-nav__item project-nav__item--prev" aria-label="Previous project: ${prev.title}">
            <span class="project-nav__label">
              <span class="project-nav__arrow project-nav__arrow--prev" aria-hidden="true">←</span>
              Previous
            </span>
            <span class="project-nav__title">${prev.title}</span>
           </a>`
        : `<div class="project-nav__item project-nav__item--prev"></div>`;

      const nextHTML = next
        ? `<a href="project.html?id=${next.id}" class="project-nav__item project-nav__item--next" aria-label="Next project: ${next.title}">
            <span class="project-nav__label">
              Next
              <span class="project-nav__arrow project-nav__arrow--next" aria-hidden="true">→</span>
            </span>
            <span class="project-nav__title">${next.title}</span>
           </a>`
        : `<div class="project-nav__item project-nav__item--next"></div>`;

      return `
        <figure class="project-hero" aria-label="Hero image for ${project.title}">
          <img class="project-hero__img"
               src="${project.hero}"
               alt="${project.heroAlt}"
               loading="eager">
        </figure>

        <header class="project-header">
          <div class="project-header__left">
            <p class="project-meta">${project.category}&nbsp;&nbsp;·&nbsp;&nbsp;${project.year}</p>
            <h1 class="project-title">${project.title}</h1>
          </div>
          <div class="project-header__right">
            <p class="project-description">${project.description}</p>
          </div>
        </header>

        <hr class="divider" aria-hidden="true">

        ${galleryHTML}

        <nav class="project-nav" aria-label="Project navigation">
          ${prevHTML}
          ${nextHTML}
        </nav>`;
    }

    function buildNotFound() {
      return `
        <div class="not-found">
          <p class="not-found__label">Project not found</p>
          <h1 class="not-found__heading">This one<br>got away.</h1>
          <a href="index.html#work" class="not-found__link">Back to all work</a>
        </div>`;
    }


    /* ── Init ─────────────────────────────────────────────── */
    const id = getProjectId();
    const project = getProject(id);
    const main = document.getElementById('main-content');

    if (project) {
      const { prev, next } = getAdjacentProjects(id);
      main.innerHTML = buildPage(project, prev, next);
      document.title = `${project.title} — Katrina Khoury`;
      document.querySelector('meta[name="description"]').content =
        `${project.category}, ${project.year} — ${project.description}`;
    } else {
      main.innerHTML = buildNotFound();
    }
  </script>

</body>
</html>
